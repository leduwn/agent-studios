[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/control-plane",
    "crates/provider",
    "crates/codex-bridge",
    "crates/protocol-adapters",
    "crates/runtime-transport",
    "crates/runtime-session",
    "crates/internal-agent",
    "crates/orchestration",
    "crates/workspace",
    "crates/external-runtime",
    "crates/opencode-runtime",
    "crates/cli-client",
    "crates/tui",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Agent Studios Contributors"]
repository = "https://github.com/leduwn/agent-studios"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
crossterm = { version = "0.29.0", features = ["bracketed-paste", "event-stream"] }
clap = { version = "4.5", features = ["derive"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
textwrap = "0.16"
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "efa177859fd9623d57b9fe7ae9bf491ae1ac6ec4" }

[profile.dev]
debug = 1

[profile.test]
debug = 1


