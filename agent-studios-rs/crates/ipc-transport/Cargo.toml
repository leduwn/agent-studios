[package]
name = "agent-studios-ipc-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native authenticated IPC transport vertical slice for Agent Studios (M13 IPC-01)"

[[bin]]
name = "agsd"
path = "src/bin/agsd.rs"

[dependencies]
agent-studios-ipc-protocol = { path = "../ipc-protocol" }
agent-studios-control-plane = { path = "../control-plane" }
agent-studios-protocol = { path = "../protocol" }
agent-studios-provider = { path = "../provider" }
agent-studios-external-runtime = { path = "../external-runtime" }
agent-studios-opencode-runtime = { path = "../opencode-runtime" }
agent-studios-workspace = { path = "../workspace" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
bytes = "1.6"
tokio = { version = "1.40", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "io-util", "net", "signal", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
