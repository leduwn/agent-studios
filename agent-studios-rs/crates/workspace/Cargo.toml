[package]
name = "agent-studios-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
agent-studios-protocol = { path = "../protocol" }
agent-studios-control-plane = { path = "../control-plane" }
codex-worktree = { path = "../../../codex-rs/worktree" }
dunce = "1.0"
tempfile = "3"
sha2 = "0.10"
tokio = { version = "1.40", features = ["sync", "time", "rt", "macros", "process"] }
tracing = "0.1"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1.40", features = ["sync", "time", "rt-multi-thread", "macros"] }
tempfile = "3"
