[package]
name = "agent-studios-internal-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
agent-studios-protocol = { path = "../protocol" }
agent-studios-control-plane = { path = "../control-plane" }
agent-studios-provider = { path = "../provider" }
agent-studios-protocol-adapters = { path = "../protocol-adapters" }
agent-studios-runtime-transport = { path = "../runtime-transport" }
agent-studios-runtime-session = { path = "../runtime-session" }
agent-studios-codex-bridge = { path = "../codex-bridge" }
codex-core-api = { path = "../../../codex-rs/core-api" }
codex-core = { path = "../../../codex-rs/core" }
codex-protocol = { path = "../../../codex-rs/protocol" }
codex-config = { path = "../../../codex-rs/config" }
codex-extension-api = { path = "../../../codex-rs/ext/extension-api" }
codex-login = { path = "../../../codex-rs/login" }
codex-exec-server = { path = "../../../codex-rs/exec-server" }
codex-home = { path = "../../../codex-rs/codex-home" }
