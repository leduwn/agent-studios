[package]
name = "agent-studios-opencode-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "OpenCode CLI runtime adapter and OS process sandboxing for Agent Studios"

[dependencies]
agent-studios-protocol = { path = "../protocol" }
agent-studios-provider = { path = "../provider" }
agent-studios-external-runtime = { path = "../external-runtime" }
agent-studios-workspace = { path = "../workspace" }
agent-studios-control-plane = { path = "../control-plane" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
chrono.workspace = true
url.workspace = true
tokio = { version = "1.40", features = ["sync", "time", "macros", "rt", "process", "io-util", "net"] }
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures = "0.3"
bytes = "1.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
tokio = { version = "1.40", features = ["sync", "time", "macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"
