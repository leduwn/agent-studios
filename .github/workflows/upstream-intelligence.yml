name: Upstream Intelligence & Compatibility Monitor

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    name: Check Upstream Releases & Security Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Upstream Releases & Manage Drift Issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 1. Read upstream baseline state file
            const stateFile = '.github/upstream-state.json';
            if (!fs.existsSync(stateFile)) {
              core.setFailed(`State file ${stateFile} not found.`);
              return;
            }

            let state;
            try {
              state = JSON.parse(fs.readFileSync(stateFile, 'utf8'));
            } catch (err) {
              core.setFailed(`Failed to parse ${stateFile}: ${err.message}`);
              return;
            }

            const rawRepos = state.repositories || state;
            const repoList = Array.isArray(rawRepos)
              ? rawRepos.map(item => ({
                  repo: item.repo || item.name,
                  target_version: item.target_version || item.version,
                  notes: item.notes || ''
                }))
              : Object.entries(rawRepos).map(([repo, details]) => ({
                  repo,
                  target_version: typeof details === 'string' ? details : (details.target_version || details.version),
                  notes: typeof details === 'object' ? details.notes : ''
                }));

            // 2. Fetch existing open issues to avoid duplicate alerts
            let openIssues = [];
            try {
              openIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });
            } catch (err) {
              core.warning(`Failed to list open issues: ${err.message}`);
            }

            const results = [];

            // 3. Scan each repository for upstream drift
            for (const { repo, target_version, notes } of repoList) {
              const [owner, repoName] = repo.split('/');
              let latestDetected = null;
              let detectionSource = 'none';
              let errorNotice = null;

              // Step A: Attempt to get latest release
              try {
                const release = await github.rest.repos.getLatestRelease({
                  owner,
                  repo: repoName
                });
                if (release && release.data && release.data.tag_name) {
                  latestDetected = release.data.tag_name;
                  detectionSource = 'release';
                }
              } catch (err) {
                // 404 indicates no published releases; fall through to tags
                if (err.status !== 404) {
                  core.warning(`Error fetching release for ${repo} (HTTP ${err.status}): ${err.message}`);
                  errorNotice = `HTTP ${err.status}`;
                }
              }

              // Step B: Fallback to latest tag if no release detected
              if (!latestDetected) {
                try {
                  const tags = await github.rest.repos.listTags({
                    owner,
                    repo: repoName,
                    per_page: 1
                  });
                  if (tags && tags.data && tags.data.length > 0) {
                    latestDetected = tags.data[0].name;
                    detectionSource = 'tag';
                    errorNotice = null;
                  } else if (!errorNotice) {
                    errorNotice = 'No releases or tags found';
                  }
                } catch (err) {
                  core.warning(`Error fetching tags for ${repo} (HTTP ${err.status}): ${err.message}`);
                  errorNotice = `HTTP ${err.status}`;
                }
              }

              let status = 'UP TO DATE';
              let actionSummary = 'Up to date';

              if (!latestDetected) {
                status = errorNotice ? `ERROR (${errorNotice})` : 'UNKNOWN';
                actionSummary = 'Failed to detect latest version';
              } else if (latestDetected !== target_version) {
                status = 'NEW RELEASE DETECTED';
                const issueTitle = `[Upstream Drift] ${repo} new release ${latestDetected}`;

                const existingIssue = openIssues.find(i =>
                  !i.pull_request && i.title.trim().toLowerCase() === issueTitle.trim().toLowerCase()
                );

                if (existingIssue) {
                  core.info(`Open issue #${existingIssue.number} already exists for "${issueTitle}". Skipping duplicate creation.`);
                  actionSummary = `Duplicate skipped (tracked in #${existingIssue.number})`;
                } else {
                  core.info(`New version detected for ${repo}: ${latestDetected} (baseline: ${target_version}). Creating alert issue.`);
                  const bodyLines = [
                    '## Upstream Intelligence Alert: Upstream Drift Detected',
                    '',
                    `A new version has been detected for upstream repository \`${repo}\`.`,
                    '',
                    `- **Repository:** https://github.com/${repo}`,
                    `- **Baseline Target:** \`${target_version}\``,
                    `- **Detected Version:** \`${latestDetected}\` (via ${detectionSource})`,
                    `- **Detected At:** ${new Date().toISOString()}`
                  ];
                  if (notes) {
                    bodyLines.push(`- **Notes:** ${notes}`);
                  }
                  bodyLines.push(
                    '',
                    '### Action Required',
                    `1. Review changes and release notes at https://github.com/${repo}/releases`,
                    '2. Assess compatibility, security, and breaking changes for Agent Studios runtime adapters.',
                    '3. Update `.github/upstream-state.json` once migration/evaluation is complete.',
                    '',
                    '> **Policy Reminder:** Automated notification only. Zero automatic merge or rebase is executed.'
                  );

                  try {
                    const newIssue = await github.rest.issues.create({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      title: issueTitle,
                      body: bodyLines.join('\n'),
                      labels: ['upstream-intelligence', 'automated-notice']
                    });
                    core.info(`Created issue #${newIssue.data.number} for ${repo}`);
                    actionSummary = `Created issue #${newIssue.data.number}`;
                    openIssues.push(newIssue.data);
                  } catch (err) {
                    core.error(`Failed to create issue for ${repo}: ${err.message}`);
                    actionSummary = `Issue creation failed: ${err.message}`;
                  }
                }
              }

              results.push({
                repo,
                target_version,
                latestDetected: latestDetected || 'UNKNOWN',
                status,
                actionSummary
              });
            }

            // 4. Generate summary report table
            const tableRows = [
              [
                { data: 'Repository', header: true },
                { data: 'Baseline Target', header: true },
                { data: 'Latest Detected', header: true },
                { data: 'Status', header: true },
                { data: 'Action / Notes', header: true }
              ],
              ...results.map(r => [
                r.repo,
                `\`${r.target_version}\``,
                `\`${r.latestDetected}\``,
                r.status === 'NEW RELEASE DETECTED' ? `**${r.status}**` : r.status,
                r.actionSummary
              ])
            ];

            await core.summary
              .addHeading('Upstream Intelligence Scan Results')
              .addTable(tableRows)
              .addQuote('Automated notification only. Zero automatic merge or rebase is executed.')
              .write();

            console.log('\n--- Upstream Intelligence Scan Results ---');
            for (const r of results) {
              console.log(`${r.repo}: baseline=${r.target_version}, detected=${r.latestDetected}, status=${r.status}, action=${r.actionSummary}`);
            }
