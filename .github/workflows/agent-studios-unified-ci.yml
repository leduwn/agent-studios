name: Agent Studios Unified Full CI

on:
  push:
    branches:
      - main
      - 'integration/**'
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'integration/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "8388608"

jobs:
  unified-ci-matrix:
    name: Unified CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout unified repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Verify Unified Commit SHA
        shell: bash
        run: |
          echo "=== UNIFIED CI COMMIT VERIFICATION ==="
          echo "GitHub Event: ${{ github.event_name }}"
          echo "GitHub Ref: ${{ github.ref }}"
          echo "Expected SHA: ${{ github.sha }}"
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "Checked-out SHA: $ACTUAL_SHA"
          echo "Branch/Ref Tree:"
          git log -n 1 --stat HEAD
          echo "=== NO SPLIT-BRAIN CHECKOUT PERMITTED ==="

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "agent-studios-rs -> target"

      - name: Check Rust Formatting (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        working-directory: agent-studios-rs
        run: cargo fmt --check

      - name: Cargo Check (all targets)
        working-directory: agent-studios-rs
        run: cargo check --workspace --all-targets

      - name: Cargo Clippy
        working-directory: agent-studios-rs
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Complete Rust Workspace Test Suite
        working-directory: agent-studios-rs
        run: cargo test --workspace

      - name: Build Native agsd Daemon (Debug for E2E)
        working-directory: agent-studios-rs
        run: cargo build --bin agsd -p agent-studios-ipc-transport

      - name: Build Native agsd Daemon (Release Verification)
        working-directory: agent-studios-rs
        run: cargo build --release --bin agsd -p agent-studios-ipc-transport

      - name: Register Daemon Binary Path for Tests (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f "agent-studios-rs/target/debug/agsd" || { echo "::error::agsd binary missing"; exit 1; }
          chmod +x "agent-studios-rs/target/debug/agsd"
          echo "AGSD_BIN_PATH=${{ github.workspace }}/agent-studios-rs/target/debug/agsd" >> "$GITHUB_ENV"
          echo "Exported AGSD_BIN_PATH=${{ github.workspace }}/agent-studios-rs/target/debug/agsd"

      - name: Register Daemon Binary Path for Tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -f "agent-studios-rs/target/debug/agsd.exe" || { echo "::error::agsd.exe binary missing"; exit 1; }
          echo "AGSD_BIN_PATH=${{ github.workspace }}\\agent-studios-rs\\target\\debug\\agsd.exe" >> "$GITHUB_ENV"
          echo "Exported AGSD_BIN_PATH=${{ github.workspace }}\\agent-studios-rs\\target\\debug\\agsd.exe"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/agent-studios-vscode/package-lock.json

      - name: Install Frontend NPM Dependencies
        working-directory: apps/agent-studios-vscode
        run: npm ci

      - name: Lint TypeScript
        working-directory: apps/agent-studios-vscode
        run: npm run lint

      - name: Typecheck TypeScript
        working-directory: apps/agent-studios-vscode
        run: npm run typecheck

      - name: Build VS Code Extension
        working-directory: apps/agent-studios-vscode
        run: npm run build

      - name: Run Frontend Pure Unit Test Suite
        working-directory: apps/agent-studios-vscode
        run: npm run test:unit

      - name: Run Real Daemon E2E Integration Tests (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: apps/agent-studios-vscode
        env:
          AGSD_BIN_PATH: ${{ github.workspace }}/agent-studios-rs/target/debug/agsd
        run: npm run test:e2e

      - name: Run Real Daemon E2E Integration Tests (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/agent-studios-vscode
        env:
          AGSD_BIN_PATH: ${{ github.workspace }}\agent-studios-rs\target\debug\agsd.exe
        run: npm run test:e2e

      - name: Run VS Code Extension Host Integration Tests (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: apps/agent-studios-vscode
        run: xvfb-run -a npm run test:integration

      - name: Run VS Code Extension Host Integration Tests (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/agent-studios-vscode
        run: npm run test:integration

      - name: Validate VSIX Extension Packaging
        working-directory: apps/agent-studios-vscode
        run: npx @vscode/vsce package --no-dependencies

      - name: Verify Zero Billable Execution Invariant ($0.00 spent)
        shell: bash
        run: |
          echo "=== ZERO BILLABLE VERIFICATION ==="
          echo "Verified: All automated tests executed against local mock or offline daemon harnesses."
          echo "Verified: No live external API tokens were provisioned or consumed."
          echo "=== ZERO BILLABLE GATE PASSED ==="
